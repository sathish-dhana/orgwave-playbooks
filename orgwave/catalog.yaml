# id = folder under playbooks/ — add a row and matching playbooks/<id>/SKILL.md (this file lives in orgwave/)
#
# For “Add to Cursor” from github.com READMEs: set your GitHub Pages origin (folder /docs), no trailing slash.
# See docs/README.md. Uncomment and edit when Pages is live:
# mcp_install_bridge: https://YOUR_ORG.github.io/YOUR_REPO

playbooks:
  - id: readme-cursor-smoke-test
    name: README Cursor smoke test
    description: Test flow — GitHub MCP only for discovery, README change, push, and PRs; pick targets, one PR per repo.
    mcp_install: github
  - id: confluence-service-doc
    name: Confluence service stub
    description: User gives a service name; Confluence MCP creates a minimal page (Java + Spring Boot versions only).
    mcp_install: confluence
